name: CD Pipeline - Deploy to AWS

on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR
        run: ./mvnw clean package -DskipTests
        working-directory: Back-End

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            terraform init \
              -backend-config="bucket=kata-cloud-tfstate-mateo" \
              -backend-config="key=dev/terraform.tfstate" \
              -backend-config="region=us-east-1"
          else
            terraform init \
              -backend-config="bucket=kata-cloud-tfstate-mateo" \
              -backend-config="key=prod/terraform.tfstate" \
              -backend-config="region=us-east-1"
          fi
        working-directory: infrastructure/terraform

      # Deploy to DEV environment when pushing to develop branch
      - name: Terraform Apply (DEV)
        if: github.ref == 'refs/heads/develop'
        env:
          TF_VAR_key_pair_name: ${{ secrets.DEV_KEY_PAIR_NAME || secrets.KEY_PAIR_NAME }}
          TF_VAR_my_ip: ${{ secrets.DEV_MY_IP || secrets.MY_IP }}
          TF_VAR_db_user: ${{ secrets.POSTGRES_USER_DEV }}
          TF_VAR_db_password: ${{ secrets.POSTGRES_PASSWORD_DEV }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET_DEV }}
          TF_VAR_basic_user: ${{ secrets.BASIC_USER_DEV }}
          TF_VAR_basic_password: ${{ secrets.BASIC_PASSWORD_DEV }}
          TF_VAR_duckdns_token: ${{ secrets.DEV_DUCKDNS_TOKEN || secrets.DUCKDNS_TOKEN }}
        run: |
          terraform plan -var-file="dev.tfvars" -var="spring_profile=dev" -out=tfplan
          terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform

      # Deploy to PROD environment when pushing to main branch
      - name: Terraform Apply (PROD)
        if: github.ref == 'refs/heads/main'
        env:
          TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }}
          TF_VAR_my_ip: ${{ secrets.MY_IP }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_basic_password: ${{ secrets.BASIC_PASSWORD }}
          TF_VAR_duckdns_token: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          terraform plan -var="spring_profile=prod" -out=tfplan
          terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform

      # ─────────────────────────────────────────────
      # FRONT-END: Build & Deploy
      # ─────────────────────────────────────────────

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Front-End/package-lock.json

      - name: Install Front-End dependencies
        run: npm ci
        working-directory: Front-End

      - name: Build Front-End (DEV)
        if: github.ref == 'refs/heads/develop'
        run: npm run build -- --configuration=development
        working-directory: Front-End

      - name: Build Front-End (PROD)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        working-directory: Front-End

      - name: Deploy Front-End to S3
        run: |
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          FRONTEND_URL=$(terraform output -raw frontend_url)
          aws s3 sync ../../Front-End/dist/Front-End/browser \
            s3://$FRONTEND_BUCKET \
            --delete \
            --cache-control "max-age=31536000,immutable"
          # index.html should not be cached
          aws s3 cp ../../Front-End/dist/Front-End/browser/index.html \
            s3://$FRONTEND_BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          echo "✅ Front-End deployed: $FRONTEND_URL"
        working-directory: infrastructure/terraform
