server:
  port: 8080

spring:
  application:
    name: customers-dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/customers_dev
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.customers.kata_bbog: DEBUG

app:
  environment-message: "🟢 Ejecutando en DEV"
