# ─────────────────────────────────────────
# Perfil TEST — Base de datos H2 en memoria
# ─────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:customers_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: false

security:
  jwt:
    secret: dev-secret-key-minimum-256-bits-long-for-hs256-testing-purposes-only-12345
    expiration: 3600000  # 1 hour
  basic:
    username: admin-test
    password: test-password-123

